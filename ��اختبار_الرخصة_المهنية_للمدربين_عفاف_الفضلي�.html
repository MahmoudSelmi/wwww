<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#667085;--accent:#7c3aed;--accent2:#5b21b6;--ok:#15803d;--bad:#b42318;--border:#e5e7eb;--shadow:0 12px 35px rgba(16,24,40,.09)}
*{box-sizing:border-box} body{margin:0;font-family:Tahoma,Arial,"Noto Kufi Arabic",sans-serif;background:linear-gradient(135deg,#f8f7ff,#eef6ff);color:var(--text)}
.wrap{max-width:900px;margin:auto;padding:18px} header{background:linear-gradient(135deg,#5b21b6,#7c3aed 55%,#2563eb);color:#fff;border-radius:24px;padding:24px;box-shadow:var(--shadow);margin-bottom:16px}
.brand{font-size:14px;opacity:.9} h1{margin:7px 0;font-size:clamp(23px,5vw,36px)} .sub{opacity:.9;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px} .stat{background:rgba(255,255,255,.14);padding:10px;border-radius:14px;text-align:center} .stat b{display:block;font-size:20px}
.progress{height:10px;background:#e9d5ff;border-radius:99px;overflow:hidden;margin:14px 0} .bar{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#a3e635);transition:.25s}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:var(--shadow)} .qno{color:var(--accent);font-weight:800;font-size:14px} .question{font-size:21px;line-height:1.9;font-weight:700;margin:10px 0 18px}
.option{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:right;border:2px solid var(--border);background:#fff;border-radius:16px;padding:14px;margin:10px 0;cursor:pointer;font-size:17px;line-height:1.7;transition:.15s} .option:hover{border-color:#c4b5fd;background:#faf7ff} .letter{min-width:34px;height:34px;border-radius:50%;background:#f3e8ff;color:#6d28d9;display:grid;place-items:center;font-weight:800} .option.correct{border-color:#22c55e;background:#f0fdf4} .option.wrong{border-color:#ef4444;background:#fef2f2} .option.disabled{cursor:default}
.feedback{display:none;border-radius:16px;padding:15px;margin-top:14px;line-height:1.8} .feedback.show{display:block} .feedback.ok{background:#ecfdf3;color:#166534;border:1px solid #bbf7d0} .feedback.bad{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px} button{border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:800;cursor:pointer} .primary{background:var(--accent);color:#fff} .secondary{background:#eef2ff;color:#3730a3} .danger{background:#fff1f2;color:#b42318} button:disabled{opacity:.45;cursor:not-allowed}
.result{display:none;text-align:center} .result.show{display:block} .score{font-size:48px;font-weight:900;color:var(--accent);margin:8px} .medal{font-size:50px} .review{text-align:right;margin-top:18px} .review-item{padding:12px;border:1px solid var(--border);border-radius:14px;margin:8px 0;background:#fafafa}
.small{font-size:13px;color:var(--muted)} footer{text-align:center;color:var(--muted);padding:18px} .hidden{display:none!important}
@media(max-width:600px){.wrap{padding:10px} header,.card{border-radius:18px;padding:17px} .question{font-size:18px} .option{font-size:15px} .stats{gap:6px}}
</style></head>

<header><div class="brand">اختبار تفاعلي من الأسئلة المرفقة</div><h1>الرخصة المهنية للمدربين</h1><p class="sub">المدربة: <b>عفاف الفضلي</b> · تغذية فورية · تعزيز · إعادة محاولة · حفظ التقدم</p>

<script>
const QUESTIONS=[{"id":1,"q":"أثناء تدريب عملي، لاحظ المدرب أن المتدر ب يكرر نفس الخطأ في تسلسل تركيب ئدابمل ًاقفو ةيلعاف \"رثكلأا\" ءارجلإا .عطقلا المدرسة السلوكية لضمان تعديل السلوك هو: •","options":{"أ":"إيقاف المتدرب فوراً وتوجيهه للبدء من جديد مع التركيز على الملاحظة. •","ب":"تقديم تغذية راجعة تصحيحية فورية مقرونة بتعزيز إيجابي عند تجاوز الخطوة المتعثرة. •","ج":"ترك المتدرب يحاول مراراً حتى يكتشف التسلسل الصحيح من خلال التجربة والخطأ. •","د":"عرض فيديو توضيحي للعملية مرة أخرى لتعميق الفهم البصري للمهمة. •"},"answer":"ب","explanation":"السلوكية تعتمد على \"الارتباط\" الفوري بين الأداء والتعزيز لتثبيت السلوك الصحيح، بينما (ج) تميل للبنائية و(د) للمعرفية)."},{"id":2,"q":"في ورشة عمل حول \"التفكير الاستراتيجي\"، تعمد المدرب عرض المشكلة ةدعاسمل ،ليصافتلا حرش لبق ًلاوأ ةيلكلا المتدربين على تكوين \"صورة ذهنية\" شاملة. هذا الإجراء يحاكي: •","options":{"أ":"مبدأ \"التعلم بالنمذجة\" في النظرية الاجتماعية. •","ب":"مبدأ \"الاستبصار\" وتنظيم الإدراك في المدرسة المعرفية. •","ج":"مبدأ \"المثير والاستجابة\" في المدرسة السلوكية. •","د":"مبدأ \"التعلم بالأقران\" في المدرسة البنائية. •"},"answer":"ب","explanation":"المعرفية تهتم بكيفية إدراك العقل للكل قبل الأجزاء وبناء الروابط الذهنية)."},{"id":3,"q":"مدرب يخطط لجلسة تدريبية لفئة \"الخبراء\" في مجال الإدارة. أي المداخل ًايئارجإ \"حصأ\" ةيلاتلا لضمان تفاعلهم وفق خصائص الكبار (الأندراغوجيا)؟ •","options":{"أ":"تخصيص وقت كافٍ للمحاضرة النظرية لتحديث معلوماتهم القديمة بمفاهيم حديثة. •","ب":"صياغة األنشطة بناءً على مشكالت واقعية يواجهونها في عملهم لتبادل الحلول. •","ج":"استخدام نظام الحوافز والمكافآت لرفع مستوى التنافسية والدافعية بينهم. •","د":"تكليفهم بقراءة المادة العلمية بشكل فردي ثم إجراء اختبار تقييمي شامل. •"},"answer":"ب","explanation":"الخيار (أ) قد دنع \"ملعتلل ةجاحلا\" نكل ،ًاحيحص ودبي الكبار تنبع من \"واقعية المشكلات\" وليس مجرد تحديث المعلومات)."},{"id":4,"q":"ًايأر بردتم حرط ،يعامج شاقن ءانثأ : .بردملا يأرلو ةيملعلا ةداملل ًامامت ًافلاخم الإجراء \"الأصح\" الذي يضمن استمرارية التعلم النشط هو: •","options":{"أ":"تصحيح المعلومة للمتدرب فوراً مدعومة بالمراجع لقطع دابر الخطأ العلمي. •","ب":"شكر المتدرب على شجاعته وتجاوز ًايفلات يلاتلا عوضوملل لاقتنلال ةطقنلا للجدل. •","ج":"تحويل رأي المتدرب كقضية للنقاش بين المجموعات لتمحيصها والوصول للحقيقة. •","د":"الطلب من المتدرب تأجيل رأيه لنهاية اليوم لمناقشته بشكل فردي مع المدرب. •"},"answer":"ج","explanation":"في قياس، \"المدرب الميسر\" هو من يحول المواقف الطارئة إلى فرص تعلم جماعية)."},{"id":5,"q":"اكتشف مدرب في منتصف البرنامج أن بعض المتدربين المتميزين يشعرون بالملل بسبب سهولة الأنشطة. الإجراء \"الأنسب\" لتطبيق التمايز التدريبي هو: •","options":{"أ":"الطلب من المتميزين مساعدة زملائهم المتعثرين لتعزيز روح التعاون. •","ب":"زيادة وتيرة الشرح النظري لتغطية .ةيملعلا ةداملا يف ًاقمع رثكأ بناوج •","ج":"تزويد المتدربين المتميزين بمهام ذات مستويات تفكير عليا (تحدي) بشكل إضافي. •","د":"إعادة توزيع المجموعات بحيث يترأس كل متميز مجموعة تدريبية. •"},"answer":"ج","explanation":"(أ) و(د) حلول إدارية، لكن (ج) هو الحل \"التدريبي\" الذي يلبي احتياجات النمو المعرفي للفرد)."},{"id":6,"q":"أي من المعايير التالية هو \"الأكثر أهمية\" عند اختيار وسيلة تعليمية لدرس عملي حول \"صيانة الدوائر الكهربائية\"؟ •","options":{"أ":"مدى حداثة التقنية المستخدمة في الوسيلة وجذبها لانتباه المتدربين. •","ب":"سهولة استخدام الوسيلة من قِبل المدرب وتوفرها في القاعة التدريبية. •","ج":"مدى مواءمة الوسيلة للأهداف السلوكية وطبيعة المهارة العملية المستهدفة. •","د":"انخفاض التكلفة المادية للوسيلة وإمكانية تكرار استخدامها لعدة مرات. •"},"answer":"ج","explanation":"جميع الخيارات معايير صحيحة، لكن \"المواءمة مع الهدف\" هي المعيار الحاكم والأول في تصميم التدريب)."},{"id":7,"q":"مدرب يريد بناء \"اختبار بعدي\" لبرنامج تقني. لضمان \"صدق\" :ًايئارجإ هيلع بجي ،رابتخلاا •","options":{"أ":"التأكد من أن درجات المتدربين ستكون متقاربة عند إعادة الاختبار مرة أخرى. •","ب":"صياغة أسئلة متنوعة تغطي كافة مستويات بلوم (تذكر، فهم، تطبيق). •","ج":"مطابقة أسئلة الاختبار مع الأوزان النسبية للأهداف التدريبية في جدول المواصفات. •","د":"عرض الاختبار على مجموعة من الخبراء للتأكد من وضوح الصياغة اللغوية. •"},"answer":"ج","explanation":"(أ) هو الثبات، و(د) هو صدق المحكمين، لكن (ج) هو \"صدق المحتوى\" الإجرائي الأدق)."},{"id":8,"q":"تقدم متدرب بشكوى ضد زميله في ءانثأ هيأر شيمهتب هايإ ًامهتم ةعومجملا النشاط. الإجراء المهني \"الأول\" للمدرب هو: •","options":{"أ":"نقل المتدرب المشتكي لمجموعة أخرى .ةيسفنلا هتحار نامضل ًاروف •","ب":"توجيه لفت نظر للمتدرب الآخر بضرورة احترام آراء الزملاء. •","ج":"عقد اجتماع قصير مع المجموعة لمراجعة \"ميثاق العمل الجماعي\" المتفق عليه. •","د":"تجاهل الشكوى باعتبارها خلافات شخصية لا تؤثر على سير التدريب. •"},"answer":"ج","explanation":"الإجراء \"المهني\" يبدأ بالعودة للقواعد المنظمة (الميثاق) قبل اتخاذ إجراءات عقابية أو نقل)."},{"id":9,"q":"وجد المدرب صورة لأحد المتدربين في عرض تقديمي لزميل آخر دون الإشارة للمصدر أو أخذ الإذن. الموقف التعليمي \"الأكمل\" هنا هو: •","options":{"أ":"حسم درجات من المتدرب الذي استخدم الصورة لمخالفته الملكية الفكرية. •","ب":"الطلب من المتدرب حذف الصورة .ضرعلا لامكإ لبق ةحيرشلا رييغتو ًاروف •","ج":"استثمار الموقف لشرح مفهوم \"المواطنة الرقمية\" وحقوق الملكية للجميع. •","د":"التواصل مع المتدرب صاحب الصورة .اهمادختسا عنامي ناك نإ هلاؤسل ًارس •"},"answer":"ج","explanation":"المدرب الناجح يستثمر الأخطاء السلوكية لتحقيق أهداف \"المجال الثالث\" (القيم)."},{"id":10,"q":"أي من الممارسات التالية يعكس تطبيق المدرب لـ \"المسؤولية المهنية\" تجاه تطوير ذاته؟ •","options":{"أ":"الاعتماد على حقيبة تدريبية واحدة أثبتت نجاحها على مدى سنوات طويلة. •","ب":"التركيز على نيل شهادات حضور لبرامج تدريبية متنوعة لتعزيز سيرته الذاتية. •","ج":"تحليل نتائج تقييم المتدربين وتقارير الأداء لبناء خطة تحسين شخصية. •","د":"متابعة المدربين المشهورين في وسائل التواصل لمحاكاة أساليبهم الإلقائية. •"},"answer":"ج","explanation":"التطوير المهني في معايير قياس يعتمد على \"التأمل الذاتي\" المبني على بيانات الأداء)."},{"id":11,"q":"يريد مدرب تطبيق نموذج \"التعلم المعكوس\" (Flipped Learning) في دورة \"الأمن السيبراني\". الإجراء الإجرائي \"الأصح\" هو: •","options":{"أ":"شرح الجوانب النظرية في القاعة وتكليف المتدربين بالتطبيق العملي في المنزل. •","ب":"إرسال فيديوهات الشرح والمادة العلمية قبل اللقاء، وتخصيص وقت القاعة للمختبرات العملية. •","ج":"استخدام منصة إلكترونية لعقد الاختبارات البعدية فقط لتوفير وقت القاعة. •","د":"تقسيم المتدربين لمجموعتين؛ واحدة دعب نع ىرخلأاو ًايروضح ملعتت بالتناوب. •"},"answer":"ب","explanation":"تعريف التعلم المعكوس هو نقل \"التلقين\" للمنزل و\"التطبيق\" للقاعة)."},{"id":12,"q":"عند استخدام أدوات \"الذكاء الاصطناعي\" في التدريب، يكمن دور المدرب \"الأهم\" في: •","options":{"أ":"تدريب المتدربين على كيفية الحصول على الإجابات الجاهزة بسرعة. •","ب":"التأكد من قدرة المتدربين على نقد وتحليل المخرجات الناتجة عن الذكاء الاصطناعي. •","ج":"استبدال الأنشطة التقليدية بالكامل بأنشطة تعتمد على الروبوتات. •","د":"منع استخدام هذه الأدوات لضمان اعتماد المتدرب على تفكيره المجرد. •"},"answer":"ب","explanation":"مهارات المستقبل تركز على \"التفكير الناقد\" تجاه التقنية وليس مجرد استخدامها)."},{"id":13,"q":"أي الأهداف التالية \"أصح\" من حيث الصياغة الإجرائية القابلة للقياس؟ •","options":{"أ":"أن يدرك المتدرب أهمية السلامة المهنية في المصانع. •","ب":"أن يكتب المتدرب تقريراً عن مخاطر العمل في صفحتين دون أخطاء لغوية. •","ج":"أن يلم المتدرب بمبادئ الإسعافات الأولية بنهاية الجلسة. •","د":"أن يستعرض المدرب خطوات الإخلاء أمام المتدربين بوضوح. •"},"answer":"ب","explanation":"يحتوي على فعل أداء (يكتب)، معيار (صفحتين)، وشرط (دون أخطاء)."},{"id":14,"q":"لاحظ مدرب وجود \"صراع\" بين متدربين أثناء ورشة عمل. الإجراء الذي :وه ًايوبرت \"عازنلا ةرادإ\" ةراهم سكعي •","options":{"أ":"استبعاد الطرفين من النشاط لضمان هدوء القاعة. •","ب":"التدخل فوراً لفرض الحل الصحيح وإنهاء الجدال. •","ج":"توجيه المتدربين لاستخدام مهارات \"الاستماع النشط\" والبحث عن نقاط الاتفاق. •","د":"ترك النزاع يستمر طالما أنه لا يخرج عن حدود الأدب العام. •"},"answer":"ج","explanation":"قياس يبحث ةراهملا نم \"بردتملا نيكمت\" نع ًامئاد الاجتماعية)."},{"id":15,"q":"التقييم الذي يهدف إلى \"ترتيب المتدربين\" حسب مستوياتهم بالنسبة لبعضهم البعض يسمى: •","options":{"أ":"تقييم محكي المرجع. •","ب":"تقييم معياري المرجع. •","ج":"تقييم تشخيصي. •","د":"تقييم تكويني. •"},"answer":"ب","explanation":"معياري المرجع يقارن أداء الفرد بالمجموعة، بينما محكي المرجع يقارنه بمعيار محدد)."},{"id":16,"q":"عند استخدام استراتيجية \"دراسة الحالة\"، وجد المدرب أن المتدربين وصلوا :وه حصلأا ءارجلإا .ًامامت ةفلتخم جئاتنل •","options":{"أ":"تخطئة المجموعات التي لم تصل للحل الموجود في دليل المدرب. •","ب":"شكر الجميع وتوضيح أن حالات ةددعتم ًلاولح لمتحت ام ًامئاد ةساردلا ومنطقية. •","ج":"إعادة النشاط مرة أخرى وإعطاء تلميحات قوية للوصول للحل الصحيح. •","د":"الطلب من المجموعات التصويت على الحل الأفضل واعتماده كحل وحيد. •"},"answer":"ب","explanation":"الهدف من دراسة الحالة هو \"عملية التفكير\" وليس فقط الوصول لنتيجة موحدة)."},{"id":17,"q":"ما هو الإجراء \"الأول\" الذي يجب على المدرب القيام به عند البدء في \"تحليل الاحتياجات التدريبية\"؟ •","options":{"أ":"تصميم الاختبارات القبلية والبعدية للبرنامج. •","ب":"تحديد الفجوة بين الأداء الحالي والأداء المأمول (المطلوب). •","ج":"اختيار الوسائل التقنية المناسبة للعرض. •","د":"حجز القاعة التدريبية والتأكد من جاهزيتها. •"},"answer":"ب","explanation":"تحليل الاحتياج .)\"ةوجفلا\" ديدحتب ًامئاد أدبي"},{"id":18,"q":"\"التغذية الراجعة\" التي تقدم للمتدرب وتكون وصفية لأدائه دون إصدار حكم (ناجح/راسب) تسمى: •","options":{"أ":"تغذية راجعة تقويمية. •","ب":"تغذية راجعة تصحيحية/بنائية. •","ج":"تغذية راجعة ختامية. •","د":"تغذية راجعة سلبية. •"},"answer":"ب","explanation":"لأنها تهدف لـ \"البناء\" والتطوير أثناء العملية)."},{"id":19,"q":"أي الممارسات التالية يعزز \"التعلم المستدام\" لدى المتدربين؟ •","options":{"أ":"تزويدهم بملخصات مركزة للحفظ قبل الاختبار النهائي. •","ب":"التركيز على الأنشطة التي تتطلب ربط المهارة بحياتهم المهنية اليومية. •","ج":"استخدام أسلوب المكافآت المادية لكل إجابة صحيحة. •","د":"زيادة كمية المعلومات النظرية في الحقيبة التدريبية. •"},"answer":"ب","explanation":"الربط بالواقع يضمن انتقال أثر التعلم واستدامته)."},{"id":20,"q":"وجد المدرب أن نم يناعي \"ًايكرح\" ًابردتم كثرة التشتت أثناء المحاضرة. الإجراء الأنسب هو: •","options":{"أ":"تنبيهه بضرورة الهدوء وعدم الحركة .ءلامزلل ًامارتحا •","ب":"تكليفه بمهام إدارية مثل توزيع الأوراق أو الكتابة على السبورة. •","ج":"الطلب منه الجلوس في المقاعد الأمامية لزيادة التركيز. •","د":"إعطاؤه استراحة إضافية منفصلة عن زملائه. •"},"answer":"ب","explanation":"تفريغ الطاقة الحركية في مهام تدريبية يقلل التشتت ويدمج المتدرب)."},{"id":21,"q":"مادختسا دنع \"ًانامأ رثكلأا\" ءارجلإا : المدرب لجهازه الشخصي في القاعة هو: •","options":{"أ":"عدم وضع كلمة مرور لسهولة الدخول أثناء التدريب. •","ب":"إيقاف الإشعارات الخاصة والرسائل الشخصية قبل بدء العرض. •","ج":"السماح للمتدربين باستخدام الجهاز للبحث في الاستراحة. •","د":"حفظ كلمات مرور الحسابات البنكية في المتصفح لتوفير الوقت. •"},"answer":"ب","explanation":"إجراء احترافي لحماية الخصوصية ومنع تشتت المتدربين)."},{"id":22,"q":"\"المعلم كمرشد\" في النظرية البنائية :ًايئارجإ ينعي •","options":{"أ":"تقديم المعلومة بشكل مباشر ومبسط. •","ب":"تهيئة البيئة التعليمية وتوفير المصادر للمتدرب ليكتشف المعرفة. •","ج":"مراقبة المتدربين ومعاقبة المقصرين منهم. •","د":"وضع الاختبارات وتصحيحها ورصد الدرجات. •"},"answer":"ب","explanation":"البنائية تركز على أن الدور الأساسي للمدرب هو \"التسهيل\" وليس \"التلقين\")."},{"id":23,"q":"أي الرسوم البيانية التالية هو الأفضل لمقارنة \"ميزانية التدريب\" بين 4 أقسام مختلفة؟ •","options":{"أ":"الرسم البياني الخطي. •","ب":"الأعمدة البيانية. •","ج":"رسم التشتت. •","د":"خريطة التدفق. •"},"answer":"ب","explanation":"الأعمدة هي الأفضل للمقارنة بين فئات منفصلة)."},{"id":24,"q":"عند صياغة أسئلة اختبار \"متعدد الخيارات\"، يجب أن يكون \"الجذع\" (نص السؤال): •","options":{"أ":"محتوياً على كلمات توحي باإلجابة الصحيحة. •","ب":"طويالً جداً ليشمل كل تفاصيل المادة العلمية. •","ج":"واضحاً ومحدداً ويطرح مشكلة واحدة فقط. •","د":"بصيغة النفي دائماً لزيادة مستوى التحدي. •"},"answer":"ج","explanation":"من معايير قياس في بناء الأسئلة وضوح الجذع ووحدة الهدف)."},{"id":25,"q":"الإجراء الأنسب للتعامل مع متدرب \"كثير الكلام\" يقاطع المدرب باستمرار: •","options":{"أ":"إحراجه أمام الزملاء ليصمت. •","ب":"شكره على حماسه وتذكيره بـ \"اتفاقية الوقت\" المحددة للمداخلات. •","ج":"تجاهل مداخالته تماماً وعدم النظر إليه. •","د":"إنهاء الجلسة التدريبية مب ستخدم لتمثيل \"خطوات سير عملية إدارية معينة\"؟ •","options":{"أ":"الخريطة الذهنية. •","ب":"خريطة التدفق. •","ج":"الرسم البياني العمودي. •","د":"نموذج SWOT."},"answer":"ب","explanation":"خريطة التدفق هي التمثيل المرئي الأمثل للتسلسل المنطقي للعمليات والقرارات)."},{"id":103,"q":"المفهوم الذي يشير إلى \"التزام المدرب بأعلى معايير السلوك والنزاهة في مهنته\" هو: •","options":{"أ":"الذكاء التقني. •","ب":"أخلاقيات المهنة. •","ج":"المهارة اللغوية. •","د":"العرض والتقديم."},"answer":"ب","explanation":"أخلاقيات المهنة هي القيم والضوابط التي تحكم سلوك المهني وتصرفاته)."},{"id":104,"q":"عند رغبتك في تدريب المتدربين على مهارة يدوية دقيقة تتطلب \"الآلية\" والسرعة، فإن الإجراء التدريبي الأنسب وفق النظرية السلوكية هو: •","options":{"أ":"ترك المتدرب يكتشف الطريقة بنفسه. •","ب":"التكرار والممارسة المكثفة مع تقديم تعزيز فوري. •","ج":"شرح التاريخ النظري للمهارة قبل البدء. •","د":"عرض فيديو للمهارة دون تطبيق عملي."},"answer":"ب","explanation":"التطبيق الإجرائي للسلوكية في المهارات اليدوية يعتمد على \"التكرار\" لتثبيت السلوك و\"التعزيز\" لضمان دقة الأداء."},{"id":105,"q":"أي من الأهداف التالية صيغ صياغة سلوكية \"إجرائية\" صحيحة وفق معايير الجودة؟ •","options":{"أ":"أن يدرك المتدرب أهمية صيانة الحاسب الآلي. •","ب":"أن يشرح المدرب خطوات فك المحرك أمام المتدربين. •","ج":"أن يكتب المتدرب تقريراً فنياً من صفحة واحدة بدون أخطاء لغوية. •","د":"أن يفهم المتدرب كيفية عمل الدوائر الكهربائية."},"answer":"ج","explanation":"هذا الهدف يركز على أداء \"المتدرب\"، نمضتيو ،)بتكي( ًاظحلام ًلاعف مدختسيو .)ءاطخأ نودب( ءادلأل ًارايعم"},{"id":106,"q":"إذا لاحظت أن المتدربين لديهم خبرات سابقة واسعة في موضوع الدورة، فإن الإجراء الأنسب وفق مبادئ \"الأندراغوجيا\" هو: •","options":{"أ":"تجاهل خبراتهم والالتزام بنص الحقيبة التدريبية. •","ب":"جعلهم يستعرضون خبراتهم وربطها بالمادة العلمية الجديدة. •","ج":"إعطاؤهم اختباراً تعجيزياً إلثبات حاجتهم للمدرب. •","د":"قضاء وقت الدورة في المحاضرة والإلقاء فقط."},"answer":"ب","explanation":"رامثتسا\" ىلع ًايئارجإ موقي رابكلا ميلعت الخبرة\" السابقة كمرجع أساسي للتعلم."},{"id":107,"q":"لضمان انتقال المعلومة من الذاكرة قصيرة المدى إلى الذاكرة طويلة المدى لدى المتدربين، يجب :ًايئارجإ بردملا ىلع •","options":{"أ":"زيادة كمية المعلومات في الشريحة الواحدة. •","ب":"استخدام \"ترميز\" المعلومات عبر الصور والخرائط الذهنية والربط المنطقي. •","ج":"رفع صوت المدرب أثناء الشرح بصفة مستمرة. •","د":"منع المتدربين من تدوين الملحوظات لتركيز الانتباه."},"answer":"ب","explanation":"\"الترميز\" هو الإجراء المعرفي الذي يضمن معالجة المعلومات وتخزينها بشكل مستدام."},{"id":108,"q":"الرسم البياني الأنسب الذي يجب أن يختاره المدرب لتمثيل \"نسبة\" توزيع الميزانية التدريبية على البنود المختلفة هو: •","options":{"أ":"الرسم البياني الخطي •","ب":"الرسم الدائري •","ج":"خريطة التدفق . •","د":"رسم التشتت."},"answer":"ب","explanation":"الرسم الدائري هو الأداة الإجرائية الأفضل لتمثيل \"النسب المئوية\" والأجزاء من الكل."},{"id":109,"q":"الخطوة الإجرائية الأولى التي يجب أن يبدأ بها المدرب عند تكليفه ببناء برنامج تدريبي جديد وفق نموذج (ADDIE) هي •","options":{"أ":"كتابة المادة العلمية وتنسيقها. •","ب":"تحليل الاحتياجات التدريبية وخصائص المتدربين. •","ج":"تصميم العروض التقديمية (PowerPoint .) •","د":"وضع أسئلة الاختبار النهائي"},"answer":"ب","explanation":"مرحلة \"التحليل\" (Analysis) هي حجر الأساس الذي يبنى عليه كامل البرنامج التدريبي."},{"id":110,"q":"لضمان \"صدق المحتوى\" في الاختبار التحصيلي، يجب على المدرب القيام بإجراء: •","options":{"أ":"توزيع األسئلة عشوائياً بين السهل والصعب. •","ب":"بناء \"جدول مواصفات\" يربط الأهداف بالأوزان النسبية للمحتوى. •","ج":"جعل جميع الأسئلة من نوع \"اختيار من متعدد\". •","د":"تصحيح الاختبار مرتين للتأكد من الدرجة."},"answer":"ب","explanation":"جدول المواصفات هو الأداة التي ءازجأ لكل رابتخلاا ةيلومش ًايئارجإ نمضت المحتوى."},{"id":111,"q":"إذا أراد المدرب قياس \"مهارة\" المتدرب في استخدام جهاز قياس الأفوميتر، فإن أداة التقويم الأنسب هي: •","options":{"أ":"الاختبار التحريري (مقال). •","ب":"اختبار موضوعي (صح وخطأ). •","ج":"بطاقة ملاحظة الأداء العملي. •","د":"المقابلة الشخصية."},"answer":"ج","explanation":"المهارات الأدائية (Psychomotor ) تتطلب \"ملاحظة\" مباشرة أثناء التنفيذ لتقييمها بدقة."},{"id":112,"q":"الإجراء الصحيح لتقديم \"تغذية راجعة\" بناءة للمتدرب بعد خطأ في التطبيق هو: •","options":{"أ":"إخبار المتدرب بأنه \"فاشل\" أمام زملائه. •","ب":"تقديم معلومة \"محددة وفورية\" عن كيفية تصحيح الخطأ. •","ج":"تأجيل التصحيح إلى نهاية اليوم التدريبي. •","د":"تصحيح الخطأ دون شرح السبب للمتدرب."},"answer":"ب","explanation":"التغذية الراجعة الإجرائية يجب أن تكون \"فورية\" و\"محددة\" لضمان تعديل المسار."},{"id":113,"q":"لاحظ المدرب أن بعض المتدربين يقومون بتداول روابط برامج \"مقرصنة\" داخل مجموعة الدورة. الإجراء المهني الصحيح هو: •","options":{"أ":"تجاهل الأمر طالما أنها تخدم أهداف التدريب. •","ب":"تشجيعهم لتوفير التكاليف المالية على زملائهم. •","ج":"توضيح المخاطر الأمنية والأخلاقية وتوجيههم للبدائل القانونية. •","د":"تحميل البرامج واستخدامها معهم لتقليل الفجوة التقنية."},"answer":"ج","explanation":"الالتزام بالملكية الفكرية والأمن السيبراني إجراء مهني أصيل في قيم المدرب."},{"id":114,"q":"عند استخدام صور من الإنترنت في حقيبة تدريبية، الإجراء الصحيح لضمان \"الأمانة العلمية\" هو: •","options":{"أ":"مسح العلامة المائية من الصور لتظهر بشكل احترافي. •","ب":"كتابة \"منقول من الإنترنت\" تحت كل صورة. •","ج":"عزو الصور لمصادرها الأصلية أو استخدام صور مشاعة (Creative Commons .) •","د":"عدم كتابة أي شيء طالما أن الحقيبة للاستخدام الداخلي فقط."},"answer":"ج","explanation":"حفظ حقوق الملكية الفكرية يتطلب العزو الدقيق للمصادر الأصلية."},{"id":115,"q":"قام مدرب بتصوير المتدربين أثناء نشاط جماعي لنشرها في \"سناب شات\" الخاص به. ما هو الإجراء المهني الذي أغفله المدرب؟ •","options":{"أ":"جودة إضاءة القاعة التدريبية. •","ب":"أخذ إذن صريح من المتدربين قبل التصوير والنشر (الخصوصية). •","ج":"وضع شعار المؤسسة على الصور. •","د":"اختيار زاوية تصوير تظهر جميع المتدربين."},"answer":"ب","explanation":"احترام الخصوصية الرقمية يتطلب موافقة أصحاب العلاقة قبل نشر صورهم."},{"id":116,"q":"أي من الإجراءات التالية يعكس تطبيق المدرب لـ \"التأمل المهني\" بعد انتهاء الجلسة؟ •","options":{"أ":"مراجعة سجل الحضور والانصراف بدقة. •","ب":"تدوين ملحوظات حول المواقف التي لم يحقق فيها المتدربون الأهداف وكيفية تحسينها. •","ج":"طلب زيادة في المكافأة المالية بسبب مجهوده. •","د":"ترتيب القاعة التدريبية لليوم التالي."},"answer":"ب","explanation":"ةعجارم وه ًايئارجإ ينهملا لمأتلا \"الأداء\" والقرارات التدريبية بهدف التطوير الذاتي."},{"id":117,"q":"لتطبيق استراتيجية \"التعلم المعكوس\" في دورة تقنية، يجب على المدرب: •","options":{"أ":"شرح الدرس في القاعة وإعطاء تمارين صعبة في المنزل. •","ب":"إرسال فيديو الشرح للمتدربين قبل اللقاء، وتخصيص وقت القاعة للتطبيق والحل. •","ج":"جعل المتدربين يدرسون ويختبرون أنفسهم دون تدخل من المدرب. •","د":"عكس ترتيب فصول الحقيبة التدريبية (البدء من الأخير)."},"answer":"ب","explanation":"الإجراء الأساسي في التعلم المعكوس هو نقل \"المعرفة\" للمنزل و\"التطبيق\" للقاعة."},{"id":118,"q":"الأداة التقنية الأنسب التي تتيح للمتدربين \"العمل الجماعي المتزامن\" على وثيقة واحدة عبر الإنترنت هي: •","options":{"أ":"البريد الإلكتروني (Email .) •","ب":"التطبيقات السحابية (مثلGoogle Docs.) •","ج":"الرسائل النصيةSMS.) •","د":"ذاكرة التخزينFlash Memory .)"},"answer":"ب","explanation":"ًايئارجإ حمست ةيباحسلا تاقيبطتلا بالتعاون الفوري والمتزامن بين عدة مستخدمين."},{"id":119,"q":"عند مواجهة \"عطل تقني\" مفاجئ في جهاز العرض (Projector)، الإجراء الاحترافي السريع للمدرب هو: •","options":{"أ":"إلغاء اليوم التدريبي وصرف المتدربين. •","ب":"االنتقال فوراً لخطة بديلة (مثل استخدام السبورة أو أنشطة ورقية). •","ج":"الاستمرار في الشرح اللفظي دون الاهتمام بتفاعل المتدربين. •","د":"لوم إدارة المركز التدريبي أمام المتدربين لتبرئة نفسه."},"answer":"ب","explanation":"المرونة التدريبية تتطلب وجود \"خطة بديلة\" لمواجهة المشكلات التقنية المفاجئة."},{"id":120,"q":"لتعزيز \"التفكير الناقد\" لدى المتدربين أثناء مناقشة قضية معينة، يجب :ًايئارجإ بردملا ىلع •","options":{"أ":"إعطاؤهم الإجابة الصحيحة مباشرة لتوفير الوقت. •","ب":"طرح أسئلة تطلب منهم \"التمييز بين الحقائق والآراء\" وتحليل الأدلة. •","ج":"منع أي نقاش يخرج عن نص الحقيبة التدريبية. •","د":"جعل المتدربين يحفظون وجهة نظر .ًايفرح بردملا"},"answer":"ب","explanation":"ليلحتلا ىلع ًايئارجإ موقي دقانلا ريكفتلا والتقييم وليس التلقين والحفظ."},{"id":121,"q":"المقياس الإحصائي الأنسب الذي يستخدمه المدرب لمعرفة مدى \"تشتت\" درجات المتدربين عن المتوسط هو: •","options":{"أ":"المتوسط الحسابي. •","ب":"الانحراف المعياري. •","ج":"الوسيط. •","د":"المنوال."},"answer":"ب","explanation":"الانحراف المعياري هو الأداة الإحصائية التي تقيس مدى تباعد أو تقارب الدرجات عن متوسطها."},{"id":122,"q":"أي من الإجراءات التالية يتبعها المدرب لضمان \"موضوعية\" تصحيح الأسئلة المقالية؟ •","options":{"أ":"قراءة اسم المتدرب قبل البدء في التصحيح. •","ب":"وضع \"نموذج إجابة\" محدد بمعايير واضحة. •","ج":"تصحيح جميع أوراق المتدربين في وقت واحد دون توقف. •","د":"إعطاء درجات مرتفعة لجميع المتدربين لتجنب الشكاوى."},"answer":"ب","explanation":"معايير التصحيح تضمن استقلال الدرجة عن ذاتية المصحح ورأيه الشخصي."},{"id":123,"q":"في حال وجود متدرب \"مشاغب\" يعيق سير الجلسة، الإجراء التربوي الأول للمدرب هو: •","options":{"أ":"طرده من القاعة فوراً أمام زملائه. •","ب":"تذكير الجميع بـ \"العقد التدريبي\" المتفق عليه في بداية الدورة. •","ج":"تجاهل سلوكه تماماً حتى يمل ويتوقف. •","د":"الدخول معه في جدال حاد لإثبات قوة شخصية المدرب."},"answer":"ب","explanation":"العقد التدريبي هو المرجع القانوني والأخلاقي المتفق عليه لإدارة السلوك في القاعة."},{"id":124,"q":"لزيادة دافعية المتدربين ًايئارجإ بردملا ىلع بجي ،\"نييرصبلا\" التركيز على: •","options":{"أ":"الأنشطة الحركية والفك والتركيب. •","ب":"التسجيلات الصوتية والمحاضرات الطويلة. •","ج":"الرسوم التوضيحية، مقاطع الفيديو، والخرائط الذهنية. •","د":"القراءة الصامتة من الكتاب الورقي فقط."},"answer":"ج","explanation":"ًايئارجإ بيجتسي يرصبلا طمنلا للمثيرات المرئية والصور."},{"id":125,"q":"عند رغبتك في استخدام استراتيجية \"العصف الذهني\"، فإن الخطوة الإجرائية الصحيحة هي: •","options":{"أ":"نقد الأفكار الضعيفة فور طرحها لاستبعادها. •","ب":"قبول أكبر قدر من الأفكار (الكم قبل الكيف) دون نقد في البداية. •","ج":"السماح للمتدربين المتميزين فقط بالمشاركة. •","د":"تحديد إجابة واحدة صحيحة يجب الوصول إليها."},"answer":"ب","explanation":"من قواعد العصف الذهني \"تأجيل الحكم\" على الأفكار لفتح آفاق الإبداع."},{"id":126,"q":"\"التقويم التشخيصي\" يتم إجراؤه في أي مرحلة تدريبية؟ •","options":{"أ":"في نهاية كل جلسة تدريبية. •","ب":"قبل البدء في البرنامج التدريبي لتحديد نقاط القوة والضعف. •","ج":"بعد مرور سنة على انتهاء التدريب. •","د":"أثناء أداء الاختبار النهائي."},"answer":"ب","explanation":"التشخيص يهدف لمعرفة حالة المتدرب \"قبل\" التدريب لبناء الخطة المناسبة."},{"id":127,"q":"الإجراء الصحيح عند تصميم شريحة عرض (PowerPoint) فعالة هو •","options":{"أ":"حشو الشريحة بجميع المعلومات الموجودة في الحقيبة. •","ب":"استخدام قاعدة (6×6) أو5×5 ) لتقليل الكلام وزيادة الوضوح •","ج":"وضع حركات انتقالية كثيرة ومبهرة لجذب الانتباه. •","د":"استخدام خطوط صغيرة جداً لتوفير مساحة للصور."},"answer":"ب","explanation":"جودة العرض تتطلب \"الاختصار المركز\" لسهولة القراءة والاستيعاب."},{"id":128,"q":"لضمان \"ثبات نتائج الاختبار عند إعادة تطبيقه، يجب على المدرب: •","options":{"أ":"تغيير الأسئلة في كل مرة .رابتخلاا اهيف داعُي •","ب":"التأكد من وضوح التعليمات وثبات ظروف التطبيق. •","ج":"جعل األسئلة سهلة جداً ليحصل الجميع على نفس الدرجة. •","د":"حذف الأسئلة التي رسب فيها الكثير من المتدربين."},"answer":"ب","explanation":"الثبات يعني الحصول على نتائج متقاربة عند تكرار الاختبار في ظروف مماثلة."},{"id":129,"q":"الإجراء الأنسب لتدريب المتدربين على \"حل المشكلات\" التقنية هو استخدام استراتيجية: •","options":{"أ":"الإلقاء المباشر. •","ب":"دراسة الحالة. •","ج":"الحفظ والتسميع. •","د":"المشاهدة الصامتة."},"answer":"ب","explanation":"دراسة الحالة تضع المتدرب في موقف واقعي يتطلب التحليل واقتراح الحلول."},{"id":130,"q":"أي الإجراءات التالية يعزز \"المواطنة الرقمية\" لدى المتدربين؟ •","options":{"أ":"تشجيعهم على نسخ الحقائب التدريبية وتوزيعها دون إذن. •","ب":"تدريبهم على كيفية التأكد من مصداقية المعلومات عبر الإنترنت. •","ج":"السماح لهم باستخدام الجوال أثناء المحاضرة للتسلية. •","د":"منعهم من استخدام التقنية نهائياً داخل المركز."},"answer":"ب","explanation":"الاستخدام المسؤول والناقد للتقنية هو جوهر المواطنة الرقمية."},{"id":131,"q":"لتطبيق \"التعلم بالنمذجة\" وفق النظرية الاجتماعية، يجب على المدرب: •","options":{"أ":"شرح الخطوات نظرياً فقط. •","ب":"أداء المهمة أمام المتدربين بدقة ليقوموا بمحاكاته. •","ج":"تكليف المتدربين بقراءة كتيب التعليمات. •","د":"ترك المتدربين يجربون دون أي توجيه."},"answer":"ب","explanation":"النمذجة تعتمد على وجود \"نموذج\" .دلقُيو ظحلاُي يقيقح"},{"id":132,"q":"الإجراء الصحيح الذي يتبعه المدرب عند انتهاء المتدرب من \"التقييم الذاتي\" هو: •","options":{"أ":"إهمال النتائج لأنها غير موضوعية. •","ب":"مناقشة المتدرب في تقييمه لنفسه ومساعدته على سد فجواته. •","ج":"السخرية من المتدرب إذا أعطى نفسه درجة عالية. •","د":"تغيير درجات المتدرب لتتطابق مع رأي المدرب."},"answer":"ب","explanation":"الهدف من التقييم الذاتي هو زيادة \"وعي\" المتدرب بتقدمه ومسؤوليته عن تعلمه."},{"id":133,"q":"أي من الأدوات التالية تستخدم عورشم يف \"جرحلا راسملا\" ديدحتل ًايئارجإ تدريبي؟ •","options":{"أ":"خريطة التدفق. •","ب":"مخطط غانت. •","ج":"الرسم الدائري. •","د":"العصف الذهني."},"answer":"ب","explanation":"مخططات غانت والشبكات الزمنية هي التي تحدد تسلسل المهام والمسارات الحرجة للمشاريع."},{"id":134,"q":"أي مما يلي يمثل الفرق الجوهري بين \"القياس\" و\"التقويم\"؟ •","options":{"أ":"القياس عملية نوعية، بينما التقويم عملية كمية. •","ب":"القياس يعطي قيمة رقمية، بينما التقويم يشمل التشخيص والعلاج. •","ج":"لا يوجد فرق بينهما فهما مترادفان. •","د":"التقويم يسبق عملية القياس دائماً."},"answer":"ب","explanation":"القياس هو تقدير كمي (رقم)، أما التقويم فهو عملية أعم تشمل إصدار حكم وتعديل الخلل."},{"id":135,"q":"كل مما يلي يعد من مبادئ \"الأندراغوجيا\" (تعليم الكبار) عدا: •","options":{"أ":"الحاجة لمعرفة سبب تعلم الشيء. •","ب":"الاعتماد الكلي على المدرب كمصدر وحيد للمعلومة. •","ج":"الميل نحو التعلم الموجه لحل المشكلات. •","د":"امتلاك رصيد كبير من الخبرات السابقة."},"answer":"ب","explanation":"في تعليم الكبار، يكون المتدرب بردملا ىلع ًايلك ًادمتعم سيلو \"ًايتاذ ًاهجوم\" كما في تعليم الأطفال (البيداغوجيا)."},{"id":136,"q":"عند المقارنة بين النظرية \"السلوكية\" والنظرية \"المعرفية\"، نجد أن المعرفية تركز على: •","options":{"أ":"المثير والاستجابة فقط. •","ب":"العمليات الذهنية الداخلية كالانتباه والترميز. •","ج":"العقاب البدني لتعديل السلوك. •","د":"إهمال دور الذاكرة في التعلم."},"answer":"ب","explanation":"السلوكية تهتم بالسلوك الملاحظ، بينما المعرفية تغوص في كيفية معالجة العقل للمعلومات."},{"id":137,"q":"أي المصطلحات التالية يعبر عن \"الاستقرار في نتائج الاختبار عند إعادة تطبيقه\"؟ •","options":{"أ":"الصدق. •","ب":"الثبات. •","ج":"الموضوعية. •","د":"الشمولية."},"answer":"ب","explanation":"الثبات يعني \"الاتساق\"، أما الصدق .ًايلعف هسايقل عضو ام رابتخلاا سيقي نأ ينعيف"},{"id":138,"q":"كل المفاهيم التالية تنتمي لمدرسة \"بندورا\" (التعلم الاجتماعي) عدا: •","options":{"أ":"النمذجة. •","ب":"الملاحظة. •","ج":"المحاكاة. •","د":"الارتباط الشرطي الكلاسيكي."},"answer":"د","explanation":"الارتباط الشرطي ينتمي للمدرسة السلوكية (بافلوف)، وليس للتعلم الاجتماعي."},{"id":139,"q":"ما الفرق بين \"التقويم التكويني و\"التقويم الختامي\"؟ •","options":{"أ":"التكويني يهدف للتحسين أثناء التدريب، والختامي يهدف لإصدار حكم نهائي. •","ب":"التكويني يتم في نهاية الدورة، والختامي في بدايتها. •","ج":"التكويني لجمع الدرجات، والختامي لتقديم النصائح. •","د":"لا فرق بينهما في التوقيت أو الهدف."},"answer":"أ","explanation":"التكويني تطويري، والختامي قراري."},{"id":140,"q":"كل مما يلي يعد من مواصفات \"الهدف السلوكي\" الجيد عدا: •","options":{"أ":"أن يبدأ بفعل مضارع قابل للقياس. •","ب":"أن يصف أداء المدرب أثناء الشرح. •","ج":"أن يتضمن معياراً لألداء. •","د":"أن يركز على ناتج تعلم واحد."},"answer":"ب","explanation":"الهدف السلوكي يجب أن يصف أداء \"المتدرب\" وليس أداء المدرب."},{"id":141,"q":"أي الأدوات التالية هي الأنسب لتقييم \"الجانب الوجداني\" (الميول والاتجاهات) لدى المتدرب؟ •","options":{"أ":"الاختبار التحصيلي. •","ب":"الاستبانة أو مقياس الاتجاه. •","ج":"اختبار الأداء العملي. •","د":"المسائل الرياضية."},"answer":"ب","explanation":"الجوانب الوجدانية لا تقاس بالاختبارات المعرفية، بل بالمقاييس النفسية والاستبانات."},{"id":142,"q":"نم ًاءزج ربتعت ةيلاتلا رصانعلا لك : نموذج (ADDIE) لتصميم التدريب عدا •","options":{"أ":"التحليل. •","ب":"التصميم. •","ج":"التسويق. •","د":"التنفيذ."},"answer":"ج","explanation":"التسويق ليس مرحلة فنية في نموذج ADDIE الذي يركز على التصميم التعليمي"},{"id":143,"q":"الفرق بين \"التعلم النشط\" و\"التعلم التقليدي\" هو أن التعلم النشط: •","options":{"أ":"يجعل المتدرب مستقبالً سلبياً للمعلومة. •","ب":"يركز على الحفظ والاستظهار. •","ج":"يضع المتدرب في مركز العملية التدريبية عبر المشاركة والبحث. •","د":"يعتمد كلياً على المحاضرة الطويلة."},"answer":"ج","explanation":"التعلم النشط يقوم على الفاعلية والمشاركة، بينما التقليدي يقوم على التلقين."},{"id":144,"q":"أي مما يلي يمثل الفرق بين \"الأمانة العلمية\" و\"الملكية الفكرية\"؟ •","options":{"أ":"الأمانة العلمية خلق شخصي، والملكية الفكرية حماية قانونية للإنتاج. •","ب":"هما مصطلحان لمعنى واحد تماماً. •","ج":"الملكية الفكرية تسمح بالنسخ دون إذن، والأمانة تمنعه. •","د":"الأمانة العلمية تخص المدرب، والملكية الفكرية تخص المتدرب."},"answer":"أ","explanation":"الأمانة التزام أدبي بالعزو، والملكية الفكرية إطار قانوني يحمي الحقوق."},{"id":145,"q":"كل مما يلي يعد من ممارسات \"المواطنة الرقمية\" المسؤولة عدا: •","options":{"أ":"احترام خصوصية الآخرين وبياناتهم. •","ب":"التأكد من صحة المعلومات قبل نشرها. •","ج":"مشاركة كلمات المرور الخاصة بالمنصة التدريبية مع الآخرين. •","د":"الالتزام بآداب الحوار في الفصول الافتراضية."},"answer":"ج","explanation":"مشاركة كلمات المرور تنتهك معايير الأمن الرقمي والخصوصية."},{"id":146,"q":"ما الذي يميز \"التأمل المهني\" عن \"التفكير العادي\"؟ •","options":{"أ":"التأمل المهني عملية عشوائية غير منظمة. •","ب":"التأمل المهني عملية هادفة لتحليل الممارسات وتجويد الأداء المستقبلي. •","ج":"التفكير العادي يهتم بنقد الآخرين فقط. •","د":"لا يوجد فرق جوهري بينهما."},"answer":"ب","explanation":"التأمل المهني هو أداة نمو مهني تعتمد على نقد الذات المنظم."},{"id":147,"q":"كل السلوكيات التالية تعتبر \"أخلاقية\" في مهنة التدريب عدا: •","options":{"أ":"العدالة في التعامل مع جميع المتدربين. •","ب":"استغلال المتدربين لتحقيق مصالح شخصية. •","ج":"التطوير المستمر للكفايات المهنية. •","د":"الالتزام بالوقت والمواعيد."},"answer":"ب","explanation":"عم ًامامت ىفانتي نيبردتملا للاغتسا ميثاق أخلاقيات المهنة."},{"id":148,"q":"ما الفرق الجوهري بين \"الواقع الافتراضي\" (VR) و\"الواقع المعزز (AR)؟ •","options":{"أ":"VR ينقلك لعالم رقمي كامل، بينماAR يضيف عناصر رقمية للواقع الحقيقي •","ب":"AR و ،ًامامت ةقلغم تاراظن بلطتي VR لا يتطلب أجهزة •","ج":"VR يستخدم في الألعاب فقط، وAR يستخدم في التدريب فقط •","د":"هما تقنية واحدة بمسميين مختلفين."},"answer":"أ","explanation":"الافتراضي (Virtual) عزل كامل، والمعزز (Augmented) هو دمج الرقمي بالواقع."},{"id":149,"q":"كل مما يلي يعد من مهارات \"التفكير الناقد\" عدا: •","options":{"أ":"التمييز بين الحقيقة والرأي. •","ب":"كشف المغالطات المنطقية. •","ج":"قبول الأفكار كما هي دون فحص. •","د":"تقييم قوة الأدلة والبراهين."},"answer":"ج","explanation":"قبول الأفكار دون فحص هو \"تلقين\" .ًادقان ًاريكفت سيلو"},{"id":150,"q":"المقارنة بين \"التعلم الإلكتروني المتزامن\" و\"غير المتزامن\" توضح أن المتزامن: •","options":{"أ":"يتيح للمتدرب الدخول في أي وقت يشاء. •","ب":"يتطلب وجود المدرب والمتدربين في نفس الوقت على المنصة. •","ج":"يعتمد على البريد الإلكتروني فقط. •","د":"لا يسمح بالتفاعل المباشر."},"answer":"ب","explanation":"المتزامن هو التعلم الحي المباشر (مثل Zoom .ًلاجسم نوكي نمازتملا ريغو ،)"},{"id":151,"q":"أي العناصر التالية لا ينتمي لمجموعة \"مهارات القرن الحادي والعشرين\"؟ •","options":{"أ":"التفكير الإبداعي. •","ب":"التعاون والعمل الجماعي. •","ج":"الحفظ الآلي للمعلومات وتسميعها. •","د":"الثقافة التقنية والمعلوماتية."},"answer":"ج","explanation":"الحفظ الآلي مهارة تقليدية، بينما مهارات القرن 21 تركز على التفكير والمهارات الاجتماعية والتقنية."},{"id":152,"q":"ما الفرق بين \"المتوسط الحسابي\" و\"الوسيط\"؟ •","options":{"أ":"المتوسط هو مجموع ،اهددع ىلع ًاموسقم تاجردلا والوسيط هو القيمة التي تتوسط الدرجات. •","ب":"المتوسط هو الدرجة األكثر تكراراً، والوسيط هو أقل درجة. •","ج":"المتوسط يتأثر بالقيم المتطرفة، ج و أ( .ًابلاغ اهب رثأتي لا طيسولاو صحيحتان) •","د":"لا يوجد فرق إحصائي بينهما."},"answer":"أ","explanation":"(وهو التعريف الأدق للفرق الإجرائي في الملزمة)."},{"id":153,"q":"\"رسم التشتتScatter Plot ) يستخدم لتحليل العلاقة بين متغيرين، بينما \"المدرج التكراري\" يستخدم لـ: •","options":{"أ":"إظهار تسلسل العمليات. •","ب":"إظهار توزيع تكرار البيانات في فئات. •","ج":"توزيع النسب المئوية. •","د":"تحديد المسار الحرج."},"answer":"ب","explanation":"المدرج التكراري يحلل تكرار حدوث القيم داخل نطاقات محددة."},{"id":154,"q":"كل الرسوم التالية تستخدم لتمثيل البيانات الكمية عدا: •","options":{"أ":"الأعمدة البيانية. •","ب":"خريطة التدفق (Flowchart .) •","ج":"الخط البياني •","د":"المدرج التكراري."},"answer":"ب","explanation":"خريطة التدفق تمثل \"إجراءات ومسارات\" وليس بيانات رقمية كمية."},{"id":155,"q":"أي المصطلحات التالية لا ينتمي لمجموعة \"نظريات التعلم\"؟ •","options":{"أ":"البنائية. •","ب":"السلوكية. •","ج":"المركزية. •","د":"المعرفية."},"answer":"ج","explanation":"المركزية مصطلح إداري أو سياسي وليس نظرية تعلم."},{"id":156,"q":"أي مما يلي لا يعد من \"مستويات بلوم\" في الجانب المعرفي؟ •","options":{"أ":"الفهم. •","ب":"التحليل. •","ج":"الاستجابة الوجدانية. •","د":"التقويم."},"answer":"ج","explanation":"الاستجابة تتبع المجال الوجداني، وليس المعرفي."},{"id":157,"q":"أي من الأدوات التالية لا تنتمي لمجموعة \"وسائل العرض التقنية\"؟ •","options":{"أ":"السبورة الذكية. •","ب":"جهاز عرض الشفافيات (القديم). •","ج":"المسطرة الخشبية. •","د":"الحاسب الآلي."},"answer":"ج","explanation":"المسطرة أداة قياس أو رسم يدوية وليست وسيلة عرض تقنية."},{"id":158,"q":"أي العناصر التالية لا ينتمي لمكونات \"الحقيبة التدريبية\"؟ •","options":{"أ":"دليل المدرب. •","ب":"دليل المتدرب. •","ج":"سجل الحضور والانصراف. •","د":"العروض التقديمية."},"answer":"ج","explanation":"سجل الحضور نموذج إداري تنظيمي ةبيقحلل ينفلا ىوتحملا نم ًاءزج سيلو التدريبية."},{"id":159,"q":"أي مما يلي لا يعتبر من خصائص \"التعلم الذاتي\"؟ •","options":{"أ":"مراعاة الفروق الفردية. •","ب":"حرية المتدرب في اختيار وقت التعلم. •","ج":"الارتباط الوثيق بوجود المدرب في كل خطوة. •","د":"تحمل المتدرب مسؤولية تعلمه."},"answer":"ج","explanation":"التعلم الذاتي يقلل الاعتماد على المدرب ويزيد من استقلالية المتدرب."},{"id":160,"q":"أي المصطلحات التالية يخرج عن سياق \"تحليل الاحتياجات التدريبية\"؟ •","options":{"أ":"الفجوة الأدائية. •","ب":"الوضع المأمول. •","ج":"الوضع الراهن. •","د":"التقرير الختامي للبرنامج."},"answer":"د","explanation":"التقرير الختامي يكون \"بعد\" التدريب، أما التحليل فيكون \"قبله\"."},{"id":161,"q":"أي الاستراتيجيات التالية لا تنتمي لمجموعة \"استراتيجيات التدريب الجماعي\"؟ •","options":{"أ":"التعلم المبرمج (الذاتي). •","ب":"المناقشة والحوار. •","ج":"تمثيل الأدوار. •","د":"المجموعات الصغيرة."},"answer":"أ","explanation":"التعلم المبرمج استراتيجية فردية تعتمد على تقدم المتدرب بمفرده."},{"id":162,"q":"أي مما يلي لا يعد من شروط \"الأهداف السلوكية\" (SMART)؟ .•","options":{"أ":"أن يكون محدداً •","ب":"أن يكو سايقلل ًلاباق ن. •","ج":"أن يكون طويالً ومعقداً. .•","د":"أن يكون مرتبطاً بزمن"},"answer":"ج","explanation":"التعقيد يتنافى مع وضوح الهدف ودقته."},{"id":163,"q":"أي المصطلحات التالية لا ينتمي لمجموعة \"أخلاقيات مهنة التدريب\"؟ •","options":{"أ":"الموضوعية. •","ب":"المحسوبية. •","ج":"النزاهة. •","د":"السرية."},"answer":"ب","explanation":"المحسوبية تتنافى مع العدالة والمساواة في أخلاقيات المهنة."},{"id":164,"q":"ئدابمل ًاقفو : \"الملكية الفكرية\" الواردة في ميثاق المهنة، أي الإجراءات التالية يعتبر مخالفة صريحة للأنظمة؟ •","options":{"أ":"اقتباس نص قصير مع ذكر اسم المؤلف ودار النشر. •","ب":"إعادة تصميم جداول بيانات من مرجع علمي مع الإشارة للمصدر. •","ج":"تصوير حقيبة تدريبية كاملة لمدرب آخر ووضع شعارك الشخصي عليها. •","د":"استخدام صور من مصادر المشاع الإبداعي."},"answer":"ج","explanation":"انتحال مجهود الآخرين ونسبته للذات ةيركفلا ةيكلملا قوقحل ًاميسج ًاكاهتنا دعي والقوانين المنظمة للإنتاج الفكري."},{"id":165,"q":"عند التعامل مع \"البيانات الشخصية للمتدربين (أرقام الهواتف، السجلات المهارية)، يفرض الجانب الأخلاقي على المدرب: •","options":{"أ":"استخدامها لأغراض تسويقية لدوراته القادمة دون إذن. •","ب":"الحفاظ على سريتها التامة وعدم مشاركتها مع أي جهة غير مخولة. •","ج":"نشر قائمة بأسماء المتدربين ودرجاتهم في وسائل التواصل للتحفيز. •","د":"بيع هذه البيانات لشركات التوظيف لمساعدة المتدربين."},"answer":"ب","explanation":"السرية والخصوصية الرقمية جزء لا يتجزأ من الأمانة المهنية والمعايير القانونية لحماية البيانات."},{"id":166,"q":"إذا اكتشف المدرب أثناء الجلسة التدريبية وجود \"تضارب مصالح\" (مثل وجود قريب له في الاختبار النهائي)، فإن الإجراء النظامي الأكمل هو: •","options":{"أ":"تجاهل الأمر طالما أنه يثق في نزاهته الشخصية. •","ب":"الإفصاح الفوري للجهة المنظمة لاتخاذ الإجراءات التي تضمن الحياد. •","ج":"إعطاء المتدرب القريب أصعب الأسئلة لإثبات عدم المحاباة. •","د":"الطلب من المتدرب الانسحاب من .جرحلل ًاعنم ةرودلا"},"answer":"ب","explanation":"\"الإفصاح\" هو المبدأ القانوني الأول للتعامل مع تضارب المصالح لضمان الشفافية والموضوعية."},{"id":167,"q":"في سياق \"المواطنة الرقمية والأنظمة الرسمية، أي من السلوكيات التالية يقع تحت طائلة الجرائم المعلوماتية؟ •","options":{"أ":"انتقاد المحتوى العلمي للحقيبة التدريبية بأسلوب منطقي. •","ب":"الدخول غير المصرح به على حسابات المتدربين في المنصة التدريبية. •","ج":"تسجيل المحاضرة بإذن رسمي من المركز التدريبي. •","د":"استخدام برامج عرض مجانية بدالً من البرامج المدفوعة."},"answer":"ب","explanation":"الاختراق أو الدخول غير المصرح به للأنظمة والحسابات يعد جريمة معلوماتية يعاقب عليها القانون."},{"id":168,"q":"يلتزم المدرب نيبردتملا هاجت \"ًاينهم\" :ىلع ًءانب لداع مييقت ميدقتب •","options":{"أ":"الانطباع الشخصي والميل النفسي لبعض المتدربين. •","ب":"معايير وأدوات قياس واضحة ومعلنة .)ةيعوضوم( ًاقبسم •","ج":"خلفياتهم الاجتماعية أو مراكزهم الوظيفية. •","د":"مدى موافقة المتدرب لآراء المدرب الشخصية."},"answer":"ب","explanation":"العدالة والموضوعية في التقييم تقتضي الاستناد إلى أدوات قياس (مثل الـ Rubrics ) .ةيتاذلا نع ًاديعب"},{"id":169,"q":"ينهملا ومنلا\" ريياعمل ًاقفو : هتابجاو يف ًارصقم بردملا ربتعي ،\"رمتسملا إذا: •","options":{"أ":"حضر مؤتمراً واحداً فقط في السنة. •","ب":"توقف عن تحديث مادته العلمية بناءً على المستجدات واللوائح الجديدة. •","ج":"طلب تغذية راجعة من المتدربين في نهاية الدورة. •","د":"اعتذر عن تقديم دورة في موضوع لا يتقنه."},"answer":"ب","explanation":"مواكبة التطور المعرفي والتنظيمي واجب مهني لضمان جودة التدريب ومصداقية المعلومات."},{"id":170,"q والضعف لدى المتدربين فقط. •","ج":"تشخيص الأداء وبناء خطة علاجية لتطوير مستوى المتدرب. •","د":"ترتيب المتدربين من الأول إلى الأخير."},"answer":"ج","explanation":"التقويم عملية شاملة تتجاوز مجرد إعطاء رقم (قياس) أو تشخيص (تقييم) لتصل إلى \"العلاج والتطوير\"."},{"id":175,"q":"إذا أردت التأكد من \"ثبات\" الاختبار الذي أعددته، فما هو الإجراء الصحيح؟ •","options":{"أ":"عرض الاختبار على مجموعة من الخبراء لتحكيمه. •","ب":"إعادة تطبيق الاختبار على نفس المجموعة في ظروف مماثلة ومقارنة النتائج. •","ج":"التأكد من أن الأسئلة تغطي جميع فصول الحقيبة التدريبية. •","د":"صياغة الأسئلة بلغة واضحة لا تقبل التأويل."},"answer":"ب","explanation":"الثبات يعني استقرار النتائج عند إعادة التطبيق."},{"id":176,"q":"\"التقويم ًايئارجإ فدهي \"يصيخشتلا إلى: •","options":{"أ":"رصد الدرجات النهائية للمتدربين. •","ب":"تقديم تغذية راجعة أثناء الأداء. •","ج":"تحديد مستوى المتدربين قبل البدء لبناء الخطة التدريبية. •","د":"منح شهادات الاجتياز للمبدعين."},"answer":"ج","explanation":"التقويم القبلي (التشخيصي) هو الذي يسبق التدريب لتحديد نقطة الانطلاق."},{"id":177,"q":"لضمان \"موضوعية\" التصحيح في الاختبارات المقالية، يجب على المدرب: •","options":{"أ":"تصحيح جميع الأوراق في يوم واحد. •","ب":"استخدام مقاييس التقدير بمعايير واضحة للتصحيح. •","ج":"قراءة اسم المتدرب قبل البدء في التقييم. •","د":"وضع أسئلة سهلة جداً ليجيب الجميع بنفس الطريقة."},"answer":"ب","explanation":"الموضوعية تعني استبعاد الذاتية، والـ تضمن معايير ثابتة للتصحيح."},{"id":178,"q":"أي المقاييس التالية يستخدم لمعرفة تاجرد نيب \"ًاراركت رثكلأا ةجردلا\" المتدربين؟ •","options":{"أ":"المتوسط الحسابي. •","ب":"الوسيط. •","ج":"المنوال. •","د":"الانحراف المعياري."},"answer":"ج","explanation":"المنوال هو مقياس النزعة المركزية .ًاعويش رثكلأا ةميقلا ددحي يذلا"},{"id":179,"q":"\"جدول المواصفات\" هو الأداة الأنسب لتحقيق معيار: •","options":{"أ":"ثبات الاختبار. •","ب":"صدق المحتوى والشمولية. •","ج":"سهولة التصحيح. •","د":"سرعة الأداء."},"answer":"ب","explanation":"يربط الجدول بين أوزان الأهداف التدريبية وتوزيع الأسئلة لضمان تغطية كامل المادة."},{"id":180,"q":"القيمة التي تمثل \"نقطة المنتصف ًايدعاصت اهبيترت دعب نيبردتملا تاجرد يف هي: •","options":{"أ":"المنوال. •","ب":"المتوسط الحسابي. •","ج":"الوسيط. •","د":"المدى."},"answer":"ج","explanation":"الوسيط هو القيمة التي تتوسط البيانات .ًامامت"},{"id":181,"q":"إذا كان \"الانحراف المعياري\" لدرجات المتدربين اذهف ،)رفصلا( نم ًابيرق يشير إلى: •","options":{"أ":"وجود فجوة كبيرة في مستويات المتدربين. •","ب":"تجانس كبير وتقارب في مستويات المتدربين. •","ج":"صعوبة الاختبار بشكل مبالغ فيه. •","د":"رسوب معظم المتدربين."},"answer":"ب","explanation":"الانحراف المعياري يقيس التشتت؛ فكلما قل، زاد التقارب (التجانس) حول المتوسط."},{"id":182,"q":"الأداة الأنسب لتقييم مهارة \"فك وتركيب جهاز إلكتروني\" هي: •","options":{"أ":"الاختبار التحريري. •","ب":"بطاقة الملاحظة. •","ج":"الاستبانة. •","د":"المقابلة."},"answer":"ب","explanation":"المهارات الأدائية والعملية تتطلب \"ملاحظة\" مباشرة أثناء التنفيذ."},{"id":183,"q":"تعتبر التغذية الراجعة فعالة وفق الملزمة إذا كانت: •","options":{"أ":"عامة وشاملة لجميع المتدربين في وقت واحد. •","ب":"فورية ومحددة تركز على السلوك وليس الشخص. •","ج":"تركز على نقاط الضعف فقط بلهجة حادة. •","د":"تقدم في نهاية البرنامج التدريبي فقط."},"answer":"ب","explanation":"الفورية والتحديد هما ركيزتا التغذية الراجعة البناءة."},{"id":184,"q":"\"سايقلا\" ىلع ًلااثم دعي يلي امم يأ : ؟ •","options":{"أ":"المتدرب مستواه \"ممتاز\". •","ب":"حصل المتدرب على 45 درجة من 50. •","ج":"يحتاج المتدرب إلى دورة تقوية في الرسم الهندسي. •","د":"البرنامج التدريبي حقق أهدافه بنجاح."},"answer":"ب","explanation":"القياس هو إعطاء \"تقدير كمي\" أو رقمي فقط."},{"id":185,"q":"الفرق بين \"التقييم\" و\"التقويم\" هو أن \"التقويم\": •","options":{"أ":"يكتفي بوصف الحالة الراهنة. •","ب":"يتضمن خططاً للعالج والتحسين وتعديل المسار. •","ج":"يسبق عملية القياس دائماً. •","د":"يستخدم الأرقام فقط."},"answer":"ب","explanation":"التقويم هو العملية الشاملة التي تلي التشخيص لتقديم الحلول."},{"id":186,"q":"لتقييم \"ملف إنجازالمتدرب، يجب على المدرب التركيز على: •","options":{"أ":"سرعة إنهاء المتدرب للمهام. •","ب":"توثيق تطور أداء المتدرب ونتاجه عبر زمن البرنامج. •","ج":"الدرجة النهائية في الاختبار النظري. •","د":"الحضور والانصراف اليومي."},"answer":"ب","explanation":"ملف الإنجاز أداة تقويمية توثق رحلة التعلم والتطور."},{"id":187,"q":"\"معامل الصعوبة للسؤال يحسب من خلال: •","options":{"أ":"نسبة الذين أجابوا إجابة صحيحة على السؤال. •","ب":"الفرق بين أعلى درجة وأقل درجة. •","ج":"عدد الكلمات في السؤال الواحد. •","د":"الوقت المستغرق في حل السؤال."},"answer":"أ","explanation":"معامل الصعوبة هو نسبة النجاح في السؤال الواحد."},{"id":188,"q":"إذا أردت التأكد من وجود مهارة \"تشغيل المحرك\" أو غيابها (نعم/لا) دون تدرج، نستخدم: •","options":{"أ":"مقياس التقدير. •","ب":"قائمة الشطب. •","ج":"الاختبار المقالي. •","د":"ملف الإنجاز."},"answer":"ب","explanation":"قائمة الشطب أداة ثنائية (نعم/لا) للتأكد من تنفيذ الخطوات."},{"id":189,"q":"أي مقاييس التشتت التالية يعطي فكرة سريعة عن الفرق بين أعلى وأقل درجة؟ •","options":{"أ":"المنوال. •","ب":"المدى. •","ج":"الانحراف المعياري. •","د":"الوسيط."},"answer":"ب","explanation":"المدى = أكبر قيمة - أصغر قيمة."},{"id":190,"q":"ًايئارجإ مهاسي \"ينيوكتلا ميوقتلا\" : في: •","options":{"أ":"اتخاذ قرار بنجاح أو رسوب المتدرب. •","ب":"تجويد العملية التدريبية وتعديل الأنشطة أثناء سيرها. •","ج":"تشخيص المهارات السابقة قبل الدورة. •","د":"مقارنة المركز التدريبي بمراكز أخرى."},"answer":"ب","explanation":"هو تقويم \"بنائي\" يتم أثناء العمل للتطوير اللحظي."},{"id":191,"q":"لضمان \"صدق\" الاختبار، يجب أن يقيس الاختبار: •","options":{"أ":"ما وُ ضع لقياسه فعلياً من أهداف ومحتوى. •","ب":"قدرة المتدرب على الحفظ فقط. •","ج":"سرعة الكتابة لدى المتدربين. •","د":"آراء المتدربين في شخصية المدرب."},"answer":"أ","explanation":"الصدق هو مطابقة الاختبار للأهداف والمحتوى الفعلي."},{"id":192,"q":"\"معامل التمييز المرتفع للسؤال يعني أن السؤال: •","options":{"أ":"سهل جداً لدرجة أن الجميع أجاب عليه. •","ب":"صعب جداً لدرجة أن أحداً لم يجب عليه. •","ج":"يفرق بوضوح بين المتدربين المتميزين والمتعثرين. •","د":"يحتوي على أخطاء لغوية واضحة."},"answer":"ج","explanation":"التمييز هو قدرة السؤال على الفرز بين الفئات المختلفة من المتدربين."},{"id":193,"q":"أي مما يلي يمثل تغذية راجعة \"إيجابية وبناءة\"؟ •","options":{"أ":"\"أداؤك سيء جداً اليوم\". •","ب":"\"أحسنت، لقد قمت بفك المحرك بدقة، حاول تحسين سرعتك في المرة القادمة\". •","ج":"\"انظر لزميلك كيف يعمل وتعلم منه\". •","د":"صمت المدرب عند حدوث خطأ من المتدرب."},"answer":"ب","explanation":"لأنها محددة (فك المحرك)، وإيجابية (أحسنت)، وبناءة (حاول تحسين سرعتك)."},{"id":194,"q":"عند البدء بدورة تدريبية \"إلزامية من الإدارة، وجد المدرب أن أغلب المتدربين .ملعتلل ةمواقمو ًايعافد ًاكولس نورهظي :وه \"ًاجضن رثكلأا\" ءارجلإا •","options":{"أ":"تجاهل مشاعرهم والبدء فوراً في المادة العلمية لفرض السيطرة. •","ب":"إبلاغ قسم الموارد البشرية بأسماء المتذمرين. •","ج":"تخصيص وقت في البداية لتفريغ الانفعالات وتوضيح \"العائد الشخصي\" للمتدرب. •","د":"تقديم وعود بمكافآت مالية خارج صلاحيات المدرب."},"answer":"ج","explanation":"معالجة الجانب الوجداني شرط أساسي قبل الانتقال للجانب المعرفي في تعليم الكبار."},{"id":195,"q":"أثناء تحليل احتياجات منظمة ما، اكتشف المدرب أن المشكلة \"سلوكية\" تتعلق بالتحفيز وليست \"معرفية\". الإجراء التصميمي الصحيح هو: •","options":{"أ":"تصميم دورة تدريبية مكثفة لزيادة معلوماتهم. •","ب":"التوصية بحلول غير تدريبية (مثل نم ًلادب )ةئيبلا وأ زفاوحلا ماظن ليدعت التدريب. •","ج":"إقامة ورشة عمل حول أهمية الانضباط. •","د":"تجاهل التحليل والمضي قدماً في التدريب المتفق عليه."},"answer":"ب","explanation":"؛تلاكشملا لكل ًلاح سيل بيردتلا فالمشكلات السلوكية الناتجة عن البيئة لا يحلها التدريب المعرفي."},{"id":196,"q":"ًاطبار بردم كراش \"لسحابة تخزين\" تحتوي على أعمال المتدربين في دورة سابقة كنموذج للاسترشاد به دون أخذ إذنهم. هذا التصرف يخالف مبدأ: •","options":{"أ":"الوصول الرقمي. •","ب":"الخصوصية والحقوق الرقمية •","ج":"الاتصال الرقمي. •","د":"اللياقة الرقمية."},"answer":"ب","explanation":"احترام خصوصية بيانات المتدربين وإنتاجهم الفكري جزء أصيل من مهارات المواطنة الرقمية للمدرب."},{"id":197,"q":"مدرب يريد تدريب فنيين على صيانة محركات طائرات \"أثناء\" العمل الفعلي، بحيث تظهر التعليمات الافتراضية فوق المحرك الحقيقي. التقنية الأنسب هي: •","options":{"أ":"الواقع الافتراضي (VR.) •","ب":"الواقع المعززAR.) •","ج":"الفيديو التفاعلي •","د":"المحاكاة الحاسوبية التقليدية."},"answer":"ب","explanation":"الواقع المعزز يقوم بتركيب عناصر رقمية فوق الواقع الحقيقي، وهو الأنسب للمهام الميدانية."},{"id":198,"q":"في موضوع \"أساليب التدريب (التدريب المصغر Micro-learning : ) يرغب مدرب في تقديم محتوى تدريبي لجيل (Gen Z) الذين يفضلون المعلومات السريعة الاستراتيجية الأنسب هي تقسيم المحتوى إلى: •","options":{"أ":"محاضرات مدتها ساعتان لضمان العمق. •","ب":"كبسولات تعليمية (3-5 دقائق) تركز على هدف واحد محدد. •","ج":"قراءة كتب إلكترونية طويلة (PDF.) •","د":"تدريب تعاوني مفتوح الوقت"},"answer":"ب","explanation":"التعلم المصغر يتناسب مع فترات الانتباه القصيرة ويسهل الوصول إليه عبر الجوال."},{"id":199,"q":"لاحظ المدرب أن المتدربين يشعرون بالخمول والنعاس في القاعة التدريبية رغم جودة المحتوى. الإجراء الفني الأول الذي يجب فحصه هو: •","options":{"أ":"تغيير المادة العلمية. •","ب":"درجة حرارة القاعة ونسبة الأكسجين (التهوية). •","ج":"مستوى صوت المدرب. •","د":"لون شرائح العرض."},"answer":"ب","explanation":"العوامل الفسيولوجية (البيئة المادية) تؤثر مباشرة على الانتباه؛ فارتفاع ثاني أكسيد .ًاروف ساعنلا ببسي نوبركلا"},{"id":200,"q":"استخدم مدرب نم ةينايب تاموسرو ًاروص حقيبة مدرب آخر دون اهنأ ًاربتعم ،ردصملل ةراشلإا \"متاحة على الإنترنت\". هذا السلوك يعبر عن: •","options":{"أ":"مهارة في البحث الرقمي. •","ب":"ذكاء في توفير الوقت. •","ج":"انتهاك للملكية الفكرية وأخلاقيات المدرب. •","د":"تطبيق لمبدأ الموارد التعليمية المفتوحة."},"answer":"ج","explanation":"الأمانة العلمية تفرض نسب الفضل لأصحابه حتى في الصور والرسومات التوضيحية."},{"id":201,"q":"ًايرود نيبردملا نم ةعومجم عامتجا لمناقشة التحديات التي واجهتهم في قاعات التدريب وتبادل الحلول المبتكرة يسمى: •","options":{"أ":"تدريب رسمي. •","ب":"مجتمع ممارسة •","ج":"دورة تدريب مدربين (TOT.) •","د":"إدارة الجودة الشاملة"},"answer":"ب","explanation":"مجتمعات الممارسة أو التعلم المهني هي وسيلة قوية لتطوير الأداء من خلال التعلم الجماعي غير الرسمي."}];
let order=QUESTIONS.map((_,i)=>i), idx=0, score=0, answered=false, wrong=[];
const letters=['أ','ب','ج','د'];
const el=id=>document.getElementById(id);
function save(){localStorage.setItem('trainerQuizState',JSON.stringify({order,idx,score,wrong}));}
function updateStats(){el('score').textContent=score; el('pct').textContent=Math.round(score/Math.max(1,idx+(answered?1:0))*100)+'%'; el('bar').style.width=((idx)/order.length*100)+'%';}
function render(){
 const q=QUESTIONS[order[idx]]; answered=false; el('qno').textContent=`السؤال ${idx+1} من ${order.length} · رقم ${q.id}`; el('question').textContent=q.q; el('feedback').className='feedback'; el('feedback').innerHTML=''; el('next').disabled=true;
 const box=el('options'); box.innerHTML='';
 letters.forEach(l=>{const b=document.createElement('button'); b.className='option'; b.innerHTML=`<span class="letter">${l}</span><span>${q.options[l]||''}</span>`; b.onclick=()=>choose(l,b); box.appendChild(b);}); updateStats(); save();
}
function choose(choice,btn){if(answered)return; answered=true; const q=QUESTIONS[order[idx]]; const all=[...document.querySelectorAll('.option')]; all.forEach(b=>b.classList.add('disabled')); const correct=q.answer===choice;
 if(correct){score++; btn.classList.add('correct'); el('feedback').className='feedback show ok'; el('feedback').innerHTML='🎉 <b>إجابة صحيحة!</b> أحسنتِ، استمري بهذا المستوى.';}
 else{btn.classList.add('wrong'); const ci=letters.indexOf(q.answer); all[ci].classList.add('correct'); wrong.push(order[idx]); el('feedback').className='feedback show bad'; el('feedback').innerHTML=`❌ <b>ليست الإجابة الصحيحة.</b><br>الإجابة الصحيحة: <b>(${q.answer})</b><br>${q.explanation||'راجعي مفهوم السؤال ثم أعيدي المحاولة.'}`;}
 el('next').disabled=false; updateStats(); save();}
el('next').onclick=()=>{if(idx<order.length-1){idx++;render();}else finish();};
el('retryCurrent').onclick=()=>render();
el('restart').onclick=()=>startFresh(QUESTIONS.map((_,i)=>i));
el('restart2').onclick=()=>startFresh(QUESTIONS.map((_,i)=>i));
el('retryWrong').onclick=()=>{const u=[...new Set(wrong)]; if(!u.length){startFresh(QUESTIONS.map((_,i)=>i));return;} startFresh(u);};
function startFresh(newOrder){order=newOrder;idx=0;score=0;wrong=[];el('quizCard').classList.remove('hidden');el('result').classList.remove('show');render();}
function finish(){el('quizCard').classList.add('hidden');el('result').classList.add('show');const p=Math.round(score/order.length*100);el('finalScore').textContent=`${score} / ${order.length} · ${p}%`; el('finalMsg').textContent=p>=90?'ممتاز جداً! أداء متميز 🌟':p>=75?'ممتاز! مستوى قوي 👏':p>=60?'جيد جداً، ومع إعادة المحاولة سترتفع النتيجة 💪':'لا بأس، أعيدي المحاولة وركزي على التغذية الراجعة 🌱'; el('medal').textContent=p>=90?'🏆':p>=75?'🥇':p>=60?'🥈':'💪'; const seen=[...new Set(wrong)]; el('review').innerHTML=seen.length?'<h3>مراجعة الأسئلة الخاطئة</h3>'+seen.map(i=>`<div class="review-item"><b>سؤال ${QUESTIONS[i].id}:</b> ${QUESTIONS[i].q}<br><span class="small">الإجابة الصحيحة: (${QUESTIONS[i].answer}) ${QUESTIONS[i].options[QUESTIONS[i].answer]}</span></div>`).join(''):'<p>🎉 لم تسجلي أي إجابة خاطئة.</p>'; localStorage.removeItem('trainerQuizState');}
render();
</script></body></html>
